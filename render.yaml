# Render blueprint: backend web service with persistent disk + frontend static site
services:
  - type: web
    name: llm-chat-backend
    runtime: docker
    rootDir: backend
    healthCheckPath: /health
    disk: { name: data, mountPath: /data, sizeGB: 1 }
    envVars:
      - { key: LLM_API_KEYS, sync: false }
      - { key: ALLOWED_ORIGINS, sync: false }
      - { key: ENABLE_FAILURE_SIMULATION, value: "true" }
      - { key: DATABASE_URL, value: "sqlite:////data/app.db" }
      - { key: LLM_MODEL, value: "gemini/gemini-2.0-flash" }

  - type: web
    name: llm-chat-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - { key: VITE_API_BASE_URL, sync: false }
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

